# GitHub Actions: بناء InvoiceScanner (OASIS) كملف IPA غير موقّع (للتثبيت عبر AltStore / Sideloadly / TrollStore)
# ضع الملف في:  .github/workflows/build.yaml
# التشغيل: يدويًا من تبويب Actions (Run workflow) أو تلقائيًا عند أي push على main/master.
name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "شغّل الاختبارات (Unit tests) كمان؟ بتاخد وقت إضافي على macOS"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode info
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Ensure iOS platform is installed
        run: |
          xcodebuild -downloadPlatform iOS || echo "downloadPlatform skipped/failed (may already be installed)"

      - name: Locate project (project.yml)
        run: |
          YML=$(find . -name project.yml -not -path "*/build/*" -not -path "*/.git/*" | head -1)
          if [ -z "$YML" ]; then echo "project.yml not found"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$YML")" >> "$GITHUB_ENV"
          echo "Project dir: $(dirname "$YML")"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      - name: Resolve Swift packages (CoreXLSX)
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodebuild -resolvePackageDependencies -project InvoiceScanner.xcodeproj -scheme InvoiceScanner

      - name: Build (unsigned, Release, device SDK)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project InvoiceScanner.xcodeproj \
            -scheme InvoiceScanner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | (xcpretty 2>/dev/null || cat)

      - name: Package IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "No .app produced"; exit 1; fi
          rm -rf Payload InvoiceScanner.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry InvoiceScanner.ipa Payload
          ls -lh InvoiceScanner.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceScanner-ipa
          path: ${{ env.PROJECT_DIR }}/InvoiceScanner.ipa
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore

  # اختبارات المنطق الأساسي (الضريبة، الخصم، المطابقة، المزامنة...). بتشتغل بس لما تدوس Run workflow وتفعّل run_tests.
  # continue-on-error: فشل الاختبارات مبيوقفش بناء الـ IPA.
  test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (project.yml)
        run: |
          YML=$(find . -name project.yml -not -path "*/build/*" -not -path "*/.git/*" | head -1)
          if [ -z "$YML" ]; then echo "project.yml not found"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$YML")" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      - name: Run unit tests (iOS Simulator)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE "iPhone [0-9]+[^(]*" | sed 's/ *$//')
          echo "Simulator: $DEVICE"
          xcodebuild test \
            -project InvoiceScanner.xcodeproj \
            -scheme InvoiceScanner \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | (xcpretty 2>/dev/null || cat)

      - name: Upload test log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: ${{ env.PROJECT_DIR }}/test.log
          if-no-files-found: ignore
